<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Panel</title>
    <link rel="icon" type="image/png" href="assets/GDlogo_2_ortp@10x.png">
    <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(to bottom, #0d1321, #1d2d44, #3e5c76);
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            min-height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            gap: 30px;
        }

        .title {
            font-size: 2rem;
            color: #fff;
            text-shadow: 4px 4px 0px #2a0845;
            text-align: center;
            line-height: 1.5;
        }

        .box {
            background-color: #f0f8ff;
            border: 4px solid #2a0845;
            box-shadow: 8px 8px 0px #1d2d44;
            padding: 30px 40px;
            width: 100%;
            max-width: 500px;
            color: #2a0845;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .box-title {
            font-size: 1rem;
            color: #3498db;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 10px 20px;
            border-radius: 20px;
            letter-spacing: 1px;
        }

        .status-badge.unlocked {
            background-color: #27ae60;
            color: #fff;
            border: 2px dashed #fff;
        }

        .status-badge.locked {
            background-color: #c0392b;
            color: #fff;
            border: 2px dashed #fff;
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 0 0 rgba(192, 57, 43, 0.6); }
            50%       { box-shadow: 0 0 0 8px rgba(192, 57, 43, 0); }
        }

        /* Toggle Switch */
        .toggle-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .toggle-label {
            font-size: 0.6rem;
            color: #2a0845;
        }

        .toggle-switch {
            position: relative;
            width: 80px;
            height: 40px;
            cursor: pointer;
        }

        .toggle-switch input {
            display: none;
        }

        .toggle-track {
            position: absolute;
            inset: 0;
            background-color: #27ae60;
            border: 3px solid #2a0845;
            transition: background-color 0.3s;
        }

        .toggle-switch input:checked + .toggle-track {
            background-color: #c0392b;
        }

        .toggle-thumb {
            position: absolute;
            top: 4px;
            left: 4px;
            width: 26px;
            height: 26px;
            background: #fff;
            border: 2px solid #2a0845;
            transition: left 0.3s;
        }

        .toggle-switch input:checked ~ .toggle-thumb {
            left: 46px;
        }

        .loading-msg {
            font-size: 0.6rem;
            color: #666;
        }

        .back-btn {
            background-color: #2a0845;
            color: #e8d0e3;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8rem;
            padding: 15px 25px;
            border: 4px solid #e8d0e3;
            cursor: pointer;
            box-shadow: 6px 6px 0px #1d2d44;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .back-btn:active {
            transform: translate(6px, 6px);
            box-shadow: 0px 0px 0px #1d2d44;
        }
    </style>
</head>

<body>
    <h1 class="title">ADMIN CONTROL PANEL</h1>

    <div class="box">
        <h2 class="box-title">GAME STATUS</h2>
        <div id="statusBadge" class="status-badge unlocked">🔓 GAME OPEN</div>

        <div class="toggle-container">
            <div class="toggle-label">LOCK / UNLOCK GAME</div>
            <label class="toggle-switch">
                <input type="checkbox" id="lockToggle" onchange="toggleLock()">
                <div class="toggle-track"></div>
                <div class="toggle-thumb"></div>
            </label>
        </div>

        <div class="loading-msg" id="loadingMsg">Loading status...</div>
    </div>

    <button class="back-btn" onclick="window.location.href='landing.html'">BACK TO LANDING</button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script>
        let isUpdating = false;

        async function loadLockStatus() {
            const msg = document.getElementById('loadingMsg');
            const { data, error } = await supabase
                .from('settings')
                .select('value')
                .eq('key', 'game_locked')
                .single();

            if (error) {
                msg.textContent = 'Error loading status.';
                return;
            }

            const locked = data.value === 'true';
            applyLockUI(locked);
            msg.textContent = '';
        }

        function applyLockUI(locked) {
            const badge = document.getElementById('statusBadge');
            const toggle = document.getElementById('lockToggle');
            toggle.checked = locked;

            if (locked) {
                badge.className = 'status-badge locked';
                badge.textContent = '🔒 GAME LOCKED';
            } else {
                badge.className = 'status-badge unlocked';
                badge.textContent = '🔓 GAME OPEN';
            }
        }

        async function toggleLock() {
            if (isUpdating) return;
            isUpdating = true;

            const toggle = document.getElementById('lockToggle');
            const msg = document.getElementById('loadingMsg');
            const newValue = toggle.checked ? 'true' : 'false';

            msg.textContent = 'Updating...';

            const { error } = await supabase
                .from('settings')
                .update({ value: newValue })
                .eq('key', 'game_locked');

            if (error) {
                msg.textContent = 'Error! Could not update.';
                // Revert toggle
                toggle.checked = !toggle.checked;
            } else {
                applyLockUI(toggle.checked);
                msg.textContent = toggle.checked ? 'Game is now LOCKED.' : 'Game is now OPEN.';
                setTimeout(() => { msg.textContent = ''; }, 2500);
            }

            isUpdating = false;
        }

        loadLockStatus();
    </script>
</body>

</html>
